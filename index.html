<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timbredex</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; color: #222; }
  header { text-align: center; margin-bottom: 30px; }
  #dropzone { border: 2px dashed #999; border-radius: 10px; padding: 30px; text-align: center; }
  #dropzone.dragover { background: #eef; border-color: #55f; }
  .hint { font-size: 0.85em; color: #666; }
  #previewImg { max-width: 250px; display: block; margin: 15px auto; border-radius: 8px; }
  button { padding: 10px 18px; margin: 8px 4px; cursor: pointer; border-radius: 6px; border: 1px solid #ccc; background: #f7f7f7; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  #result { margin-top: 20px; padding: 15px; border-radius: 8px; background: #f0f4f8; min-height: 20px; }
  #result img { max-width: 150px; display: block; margin-bottom: 10px; border-radius: 6px; }
  .disclaimer { font-size: 0.8em; color: #888; text-align: center; margin-top: 30px; }
  .error { color: #c00; }
</style>
</head>
<body>

<header>
  <h1>Timbredex</h1>
  <p>Identify and explore postage stamps</p>
</header>

<main>
  <section id="upload-section">
    <div id="dropzone">
      <p>Drag & drop an image here, or</p>
      <button id="chooseBtn">Choose an image</button>
      <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden>
      <p class="hint">Supported: JPG, PNG — Max size: 10MB</p>
    </div>
    <div id="previewContainer" hidden>
      <img id="previewImg" alt="Preview">
      <button id="removeBtn">Remove image</button>
    </div>
    <button id="analyzeBtn" disabled>Recognize Stamp</button>
  </section>

  <section id="loading" hidden><p>🔍 Analyzing your stamp…</p></section>
  <section id="result"></section>

  <p class="disclaimer">
    ⚠️ Prototype recognition system — may not reliably identify real-world stamp photographs.
  </p>
</main>

<script src="https://cdn.jsdelivr.net/npm/blockhash-core@0.1.0/dist/blockhash-core.min.js"></script>
<script>
let stampDatabase = [];
let currentFile = null;
const MAX_SIZE = 10 * 1024 * 1024;

const fileInput = document.getElementById('fileInput');
const chooseBtn = document.getElementById('chooseBtn');
const dropzone = document.getElementById('dropzone');
const previewContainer = document.getElementById('previewContainer');
const previewImg = document.getElementById('previewImg');
const removeBtn = document.getElementById('removeBtn');
const analyzeBtn = document.getElementById('analyzeBtn');
const loading = document.getElementById('loading');
const result = document.getElementById('result');

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function getImageData(img, size = 256) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, size, size);
  return ctx.getImageData(0, 0, size, size);
}

function hashImage(img) {
  const imageData = getImageData(img);
  return blockhash.bmvbhash(imageData, 16);
}

function hammingDistance(a, b) {
  let dist = 0;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) dist++;
  return dist;
}

async function init() {
  const res = await fetch('stamps.json');
  stampDatabase = await res.json();
  for (const stamp of stampDatabase) {
    const img = await loadImage(stamp.image);
    stamp.hash = hashImage(img);
  }
}
init();

chooseBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', (e) => {
  e.preventDefault();
  dropzone.classList.remove('dragover');
  handleFile(e.dataTransfer.files[0]);
});

function handleFile(file) {
  result.innerHTML = '';
  if (!file) return;

  if (!['image/jpeg', 'image/png'].includes(file.type)) {
    showError('Unsupported file type. Please upload a JPG or PNG image.');
    return;
  }
  if (file.size > MAX_SIZE) {
    showError('File is too large. Maximum size is 10MB.');
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      currentFile = e.target.result;
      previewImg.src = currentFile;
      previewContainer.hidden = false;
      dropzone.hidden = true;
      analyzeBtn.disabled = false;
    };
    img.onerror = () => showError('This file could not be read as a valid image.');
    img.src = e.target.result;
  };
  reader.onerror = () => showError('Failed to read the file.');
  reader.readAsDataURL(file);
}

function showError(msg) {
  result.innerHTML = `<p class="error">${msg}</p>`;
}

removeBtn.addEventListener('click', () => {
  currentFile = null;
  previewContainer.hidden = true;
  dropzone.hidden = false;
  analyzeBtn.disabled = true;
  fileInput.value = '';
  result.innerHTML = '';
});

analyzeBtn.addEventListener('click', async () => {
  if (!currentFile) return;
  analyzeBtn.disabled = true;
  loading.hidden = false;
  result.innerHTML = '';

  try {
    const img = await loadImage(currentFile);
    const uploadedHash = hashImage(img);

    let best = null;
    let bestDist = Infinity;
    for (const stamp of stampDatabase) {
      const dist = hammingDistance(uploadedHash, stamp.hash);
      if (dist < bestDist) { bestDist = dist; best = stamp; }
    }

    const maxBits = 16 * 16;
    const confidence = 100 - (bestDist / maxBits) * 100;
    const THRESHOLD = 75;

    if (confidence >= THRESHOLD) {
      result.innerHTML = `
        <img src="${best.image}" alt="${best.name}">
        <strong>${best.name}</strong> (${best.country}, ${best.year})<br>
        Denomination: ${best.denomination}<br>
        Catalog #: ${best.catalogNumber}<br>
        Confidence: ${confidence.toFixed(1)}%
      `;
    } else {
      result.innerHTML = `<p>Could not confidently identify this stamp (best match confidence: ${confidence.toFixed(1)}%). Try a clearer, well-lit, cropped photo.</p>`;
    }
  } catch (err) {
    showError('Something went wrong analyzing the image. Please try another photo.');
    console.error(err);
  } finally {
    loading.hidden = true;
    analyzeBtn.disabled = false;
  }
});
</script>
</body>
</html>
